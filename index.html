<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090A14">
  <title>Ainain</title>

  <!-- Favicon: inline golden star -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='4' fill='%23F3C97E'/><path d='M12 2v4M12 18v4M2 12h4M18 12h4' stroke='%23F3C97E' stroke-width='1.5' stroke-linecap='round'/></svg>">

  <!-- Preload key photos -->
  <link rel="preload" as="image" href="assets/photos/WhatsApp_Image_2026-09-15_at_01_16_16.jpeg">
  <link rel="preload" as="image" href="assets/photos/WhatsApp_Image_2026-09-15_at_01_16_17.jpeg">
  <link rel="preload" as="image" href="assets/photos/WhatsApp_Image_2026-09-08_at_22_51_58__1_.jpeg">
  <link rel="preload" as="image" href="assets/photos/WhatsApp_Image_2026-09-22_at_02_38_24.jpeg">

  <!-- Google Fonts: Amiri Quran, Scheherazade New, Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- Ambient & Snow Canvas -->
  <canvas id="ambientCanvas" aria-hidden="true"></canvas>

  <!-- Ambient Vignette -->
  <div class="ambient-vignette" aria-hidden="true"></div>

  <!-- Quiet Page Progress Indicator Dots -->
  <nav class="page-indicators" aria-label="Page navigation">
    <button class="page-dot active" type="button" data-page="0" aria-label="Page 1" onclick="window.ReadyApp&&window.ReadyApp.goToScene(0)"></button>
    <button class="page-dot" type="button" data-page="1" aria-label="Page 2" onclick="window.ReadyApp&&window.ReadyApp.goToScene(1)"></button>
    <button class="page-dot" type="button" data-page="2" aria-label="Page 3" onclick="window.ReadyApp&&window.ReadyApp.goToScene(2)"></button>
    <button class="page-dot" type="button" data-page="3" aria-label="Page 4" onclick="window.ReadyApp&&window.ReadyApp.goToScene(3)"></button>
    <button class="page-dot" type="button" data-page="4" aria-label="Page 5" onclick="window.ReadyApp&&window.ReadyApp.goToScene(4)"></button>
    <button class="page-dot" type="button" data-page="5" aria-label="Page 6" onclick="window.ReadyApp&&window.ReadyApp.goToScene(5)"></button>
  </nav>

  <!-- Main Scene Stage -->
  <main id="stage" class="stage" role="main">

    <!-- ==============================================
         SCENE 0: THRESHOLD
         ============================================== -->
    <section id="scene-0" class="scene active" aria-label="Threshold">
      <div class="scene-content threshold-content">
        <div class="pulse-ring-wrapper" aria-hidden="true">
          <div class="pulse-ring pulse-ring-outer"></div>
          <div class="pulse-ring pulse-ring-middle"></div>
          <div class="pulse-ring pulse-ring-core"></div>
        </div>
        <h1 class="subject-name" id="subjectName">Ainain</h1>
      </div>
      <button class="scene-handle" type="button" aria-label="Continue" data-next="1" onclick="if(window.ReadyApp&&window.ReadyApp.goToScene){window.ReadyApp.goToScene(1)}">
        <span class="handle-glow" aria-hidden="true"></span>
        <svg class="handle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 15l-6-6-6 6"/>
        </svg>
      </button>
    </section>

    <!-- ==============================================
         SCENE 1: THE ROAD HERE
         ============================================== -->
    <section id="scene-1" class="scene" aria-label="The Road Here">
      <div class="scene-content road-content">
        <!-- Mountain Silhouette in Dusk -->
        <div class="mountain-horizon" aria-hidden="true">
          <svg class="mountain-svg" viewBox="0 0 1000 320" preserveAspectRatio="none">
            <defs>
              <linearGradient id="mountainGradFar" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1E243A" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#0E121E" stop-opacity="0.95"/>
              </linearGradient>
              <linearGradient id="mountainGradNear" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#141928" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#0A0D16" stop-opacity="1"/>
              </linearGradient>
            </defs>
            <!-- Far mountain peaks -->
            <path d="M0,220 L80,170 L170,205 L260,140 L370,210 L480,120 L580,195 L690,130 L790,190 L900,150 L1000,210 L1000,320 L0,320 Z" fill="url(#mountainGradFar)"/>
            <!-- Near mountain ridges -->
            <path d="M0,250 L120,210 L220,240 L340,180 L440,230 L560,165 L670,225 L810,175 L920,220 L1000,190 L1000,320 L0,320 Z" fill="url(#mountainGradNear)"/>
          </svg>
        </div>

        <!-- Footprint Snowfield Interactive Area -->
        <div id="snowfield" class="snowfield" role="region" aria-label="Snow path">
          <div id="footprintsContainer" class="footprints-container" aria-hidden="true"></div>
          <div class="trail-guide" aria-hidden="true"></div>
        </div>

        <!-- Light for Dadyy (unlabelled lantern glow off to the side) -->
        <button id="dadyyLantern" class="dadyy-lantern" type="button" aria-label="A small quiet light">
          <span class="lantern-halo" aria-hidden="true"></span>
          <span class="lantern-core" aria-hidden="true"></span>
        </button>

        <!-- Dadyy Floating Light & Du'a Display -->
        <div id="dadyyDuaOverlay" class="dadyy-dua-overlay" aria-live="polite" aria-hidden="true">
          <div class="floating-ember" aria-hidden="true"></div>
          <div class="dadyy-text-card">
            <p class="arabic-line dadyy-arabic" id="dadyyArabic" lang="ar" dir="rtl"></p>
            <p class="translation-line dadyy-translation" id="dadyyTranslation"></p>
          </div>
        </div>
      </div>

      <button class="scene-handle" type="button" aria-label="Continue" data-next="2" onclick="if(window.ReadyApp&&window.ReadyApp.goToScene){window.ReadyApp.goToScene(2)}">
        <span class="handle-glow" aria-hidden="true"></span>
        <svg class="handle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 15l-6-6-6 6"/>
        </svg>
      </button>
    </section>

    <!-- ==============================================
         SCENE 2: STEADY HANDS
         ============================================== -->
    <section id="scene-2" class="scene" aria-label="Steady Hands">
      <div class="scene-content thread-content">
        <!-- Interactive Suture / Thread Canvas -->
        <div class="thread-arena" id="threadArena" role="region" aria-label="Trace the golden thread">
          <svg id="threadSvg" class="thread-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="goldenGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur1"/>
                <feGaussianBlur stdDeviation="14" result="blur2"/>
                <feMerge>
                  <feMergeNode in="blur2"/>
                  <feMergeNode in="blur1"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <radialGradient id="starBloomGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFF2D6" stop-opacity="1"/>
                <stop offset="30%" stop-color="#F3C97E" stop-opacity="0.9"/>
                <stop offset="70%" stop-color="#E7B863" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#F3C97E" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Guide Path (faint background thread) -->
            <path id="guidePath" class="guide-path" d="" fill="none"/>

            <!-- Active Traced Thread (golden glowing stroke) -->
            <path id="tracedPath" class="traced-path" d="" fill="none" filter="url(#goldenGlow)"/>

            <!-- Current Touch / Pen Position Indicator -->
            <g id="threadBead" class="thread-bead" aria-hidden="true">
              <circle class="bead-halo" cx="0" cy="0" r="18"/>
              <circle class="bead-core" cx="0" cy="0" r="7"/>
            </g>

            <!-- End Target Knot -->
            <g id="endTarget" class="end-target" aria-hidden="true">
              <circle class="target-ring" cx="0" cy="0" r="14"/>
              <circle class="target-dot" cx="0" cy="0" r="4"/>
            </g>

            <!-- Knot Bloom Flare (at completion) -->
            <circle id="knotBloom" class="knot-bloom" cx="0" cy="0" r="0" fill="url(#starBloomGrad)" aria-hidden="true"/>
          </svg>
        </div>

        <!-- Word Reveal: Steady. -->
        <div id="steadyWord" class="calm-word" aria-live="polite">
          <span>Steady.</span>
        </div>
      </div>

      <button class="scene-handle" type="button" aria-label="Continue" data-next="3" onclick="if(window.ReadyApp&&window.ReadyApp.goToScene){window.ReadyApp.goToScene(3)}">
        <span class="handle-glow" aria-hidden="true"></span>
        <svg class="handle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 15l-6-6-6 6"/>
        </svg>
      </button>
    </section>

    <!-- ==============================================
         SCENE 3: CHARGE
         ============================================== -->
    <section id="scene-3" class="scene" aria-label="Charge">
      <div class="scene-content charge-content">
        <!-- Ambient Breathing Aura -->
        <div id="chargeAura" class="charge-aura" aria-hidden="true"></div>

        <!-- Ayat Text Display Area (surrounding the ring) -->
        <div class="charge-ayat-container" aria-live="polite">
          <div id="chargeAyah1" class="charge-ayah ayah-item">
            <p class="arabic-line charge-arabic" id="chargeArabic1" lang="ar" dir="rtl"></p>
            <p class="translation-line charge-trans" id="chargeTrans1"></p>
          </div>

          <!-- Central Interactive Hold Ring -->
          <div class="ring-stage">
            <div id="chargeBloomWave" class="charge-bloom-wave" aria-hidden="true"></div>

            <button id="chargeRingBtn" class="charge-ring-btn" type="button" aria-label="Press and hold the ring of light">
              <svg class="ring-svg" viewBox="0 0 280 280">
                <defs>
                  <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="5" result="blur1"/>
                    <feGaussianBlur stdDeviation="12" result="blur2"/>
                    <feMerge>
                      <feMergeNode in="blur2"/>
                      <feMergeNode in="blur1"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                </defs>
                <!-- Background Faint Ring Track -->
                <circle class="ring-track" cx="140" cy="140" r="120"/>
                <!-- Filling Glowing Progress Arc -->
                <circle id="ringProgress" class="ring-progress" cx="140" cy="140" r="120" filter="url(#ringGlow)"/>
                <!-- Core Glowing Pulse -->
                <circle id="ringInnerCore" class="ring-inner-core" cx="140" cy="140" r="16"/>
              </svg>
              <!-- Center Word Reveal: Ready. -->
              <span id="readyWord" class="ready-word" aria-live="polite">Ready.</span>
            </button>
          </div>

          <div id="chargeAyah2" class="charge-ayah ayah-item">
            <p class="arabic-line charge-arabic" id="chargeArabic2" lang="ar" dir="rtl"></p>
            <p class="translation-line charge-trans" id="chargeTrans2"></p>
          </div>
        </div>
      </div>

      <button class="scene-handle" type="button" aria-label="Continue" data-next="4" onclick="if(window.ReadyApp&&window.ReadyApp.goToScene){window.ReadyApp.goToScene(4)}">
        <span class="handle-glow" aria-hidden="true"></span>
        <svg class="handle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 15l-6-6-6 6"/>
        </svg>
      </button>
    </section>

    <!-- ==============================================
         SCENE 4: PROUD
         ============================================== -->
    <section id="scene-4" class="scene" aria-label="Proud">
      <div class="scene-content proud-content">
        <!-- Golden Wire across the top -->
        <div class="wire-suspension" aria-hidden="true">
          <svg class="wire-svg" viewBox="0 0 1000 80" preserveAspectRatio="none">
            <path d="M0,20 Q500,55 1000,20" fill="none" stroke="rgba(243, 201, 126, 0.4)" stroke-width="1.2"/>
          </svg>
        </div>

        <!-- Polaroid Photos Gallery -->
        <div class="polaroid-gallery" id="polaroidGallery" role="region" aria-label="Photographs">
          <!-- Photo 1 -->
          <div class="polaroid-item" data-index="0" tabindex="0" role="button" aria-label="Photograph 1">
            <div class="pin-star" aria-hidden="true"></div>
            <div class="polaroid-frame">
              <img src="assets/photos/WhatsApp_Image_2026-09-15_at_01_16_16.jpeg" alt="Ainain" class="polaroid-img" loading="eager">
            </div>
          </div>

          <!-- Photo 2 -->
          <div class="polaroid-item" data-index="1" tabindex="0" role="button" aria-label="Photograph 2">
            <div class="pin-star" aria-hidden="true"></div>
            <div class="polaroid-frame">
              <img src="assets/photos/WhatsApp_Image_2026-09-15_at_01_16_17.jpeg" alt="Ainain" class="polaroid-img" loading="eager">
            </div>
          </div>

          <!-- Photo 3 -->
          <div class="polaroid-item" data-index="2" tabindex="0" role="button" aria-label="Photograph 3">
            <div class="pin-star" aria-hidden="true"></div>
            <div class="polaroid-frame">
              <img src="assets/photos/WhatsApp_Image_2026-09-08_at_22_51_58__1_.jpeg" alt="Ainain" class="polaroid-img" loading="eager">
            </div>
          </div>

          <!-- Photo 4 -->
          <div class="polaroid-item" data-index="3" tabindex="0" role="button" aria-label="Photograph 4">
            <div class="pin-star" aria-hidden="true"></div>
            <div class="polaroid-frame">
              <img src="assets/photos/WhatsApp_Image_2026-09-22_at_02_38_24.jpeg" alt="Ainain" class="polaroid-img" loading="eager">
            </div>
          </div>
        </div>
      </div>

      <button class="scene-handle" type="button" aria-label="Continue" data-next="5" onclick="if(window.ReadyApp&&window.ReadyApp.goToScene){window.ReadyApp.goToScene(5)}">
        <span class="handle-glow" aria-hidden="true"></span>
        <svg class="handle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 15l-6-6-6 6"/>
        </svg>
      </button>
    </section>

    <!-- ==============================================
         SCENE 5: TONIGHT (Rituals, Rest, Morning Card)
         ============================================== -->
    <section id="scene-5" class="scene" aria-label="Tonight">
      <div class="scene-content tonight-content">
        <!-- Sky stars container (populated as rituals complete) -->
        <div id="skyStars" class="sky-stars" aria-hidden="true"></div>

        <!-- Row of 4 Tactile Ritual Icons -->
        <div class="rituals-bar" role="toolbar" aria-label="Evening rituals">
          <!-- Water Glass Icon -->
          <button id="ritualGlass" class="ritual-btn" type="button" aria-label="Water" data-ritual="glass">
            <div class="ritual-icon-box glass-box">
              <svg class="ritual-svg" viewBox="0 0 64 64">
                <defs>
                  <clipPath id="glassClip">
                    <path d="M18,12 L46,12 L41,52 C40.5,56 37,58 32,58 C27,58 23.5,56 23,52 Z"/>
                  </clipPath>
                  <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#E2EEF8" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#7EA7C7" stop-opacity="0.7"/>
                  </linearGradient>
                </defs>
                <!-- Glass outline -->
                <path class="glass-outline" d="M18,12 L46,12 L41,52 C40.5,56 37,58 32,58 C27,58 23.5,56 23,52 Z"/>
                <!-- Filling water level -->
                <g clip-path="url(#glassClip)">
                  <rect id="waterFill" class="water-fill" x="14" y="60" width="36" height="50" fill="url(#waterGrad)"/>
                  <path id="waterWave" class="water-wave" d="M16,60 Q24,58 32,60 T48,60 L48,64 L16,64 Z" fill="rgba(255,255,255,0.7)"/>
                </g>
                <circle class="ritual-star-spark" cx="32" cy="14" r="2"/>
              </svg>
            </div>
          </button>

          <!-- Backpack / Bag Icon -->
          <button id="ritualBag" class="ritual-btn" type="button" aria-label="Bag" data-ritual="bag">
            <div class="ritual-icon-box bag-box">
              <svg class="ritual-svg" viewBox="0 0 64 64">
                <!-- Bag Body -->
                <path class="bag-body" d="M20,24 C20,18 25,16 32,16 C39,16 44,18 44,24 L46,52 C46,56 42,58 32,58 C22,58 18,56 18,52 Z"/>
                <path class="bag-handle" d="M26,16 C26,11 28,9 32,9 C36,9 38,11 38,16" fill="none"/>
                <!-- Zipper Track -->
                <line class="zipper-track" x1="20" y1="36" x2="44" y2="36"/>
                <circle id="zipperPull" class="zipper-pull" cx="20" cy="36" r="3"/>
                <circle class="ritual-star-spark" cx="32" cy="18" r="2"/>
              </svg>
            </div>
          </button>

          <!-- Clock Icon -->
          <button id="ritualClock" class="ritual-btn" type="button" aria-label="Clock" data-ritual="clock">
            <div class="ritual-icon-box clock-box">
              <svg class="ritual-svg" viewBox="0 0 64 64">
                <circle class="clock-rim" cx="32" cy="32" r="22"/>
                <circle class="clock-pin" cx="32" cy="32" r="2.5"/>
                <!-- Hands -->
                <line id="clockHour" class="clock-hour" x1="32" y1="32" x2="32" y2="20"/>
                <line id="clockMin" class="clock-minute" x1="32" y1="32" x2="42" y2="32"/>
                <circle class="ritual-star-spark" cx="32" cy="12" r="2"/>
              </svg>
            </div>
          </button>

          <!-- Moon Icon (Triggers Sleep Mode) -->
          <button id="ritualMoon" class="ritual-btn ritual-moon-btn" type="button" aria-label="Sleep" data-ritual="moon">
            <div class="ritual-icon-box moon-box">
              <svg class="ritual-svg" viewBox="0 0 64 64">
                <path class="moon-shape" d="M38,14 C27,15 18,24 18,36 C18,48 28,58 40,58 C45,58 49,56 52,53 C41,52 32,43 32,32 C32,24 36,17 42,13 C40.7,13.3 39.3,13.6 38,14 Z"/>
                <circle class="ritual-star-spark" cx="44" cy="22" r="2"/>
              </svg>
            </div>
          </button>
        </div>

        <!-- Corner Morning Envelope -->
        <button id="morningEnvelopeBtn" class="morning-envelope-btn" type="button" aria-label="Morning Card">
          <div class="envelope-halo" aria-hidden="true"></div>
          <svg class="envelope-svg" viewBox="0 0 48 36" aria-hidden="true">
            <rect class="env-body" x="2" y="4" width="44" height="28" rx="3"/>
            <path class="env-fold" d="M2,5 L24,22 L46,5"/>
            <circle class="env-seal" cx="24" cy="21" r="3.5"/>
          </svg>
        </button>

        <!-- Morning Card Modal Overlay -->
        <div id="morningCardOverlay" class="morning-card-overlay" role="dialog" aria-modal="true" aria-hidden="true">
          <div class="morning-card" id="morningCard">
            <button id="closeMorningCardBtn" class="close-card-btn" type="button" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>

            <!-- Bismillah -->
            <p class="arabic-line morning-bismillah" id="morningBismillah" lang="ar" dir="rtl"></p>

            <!-- Verse 1: Ta-Ha 20:25-26 -->
            <div class="morning-verse-item">
              <p class="arabic-line morning-arabic" id="morningArabic1" lang="ar" dir="rtl"></p>
              <p class="translation-line morning-trans" id="morningTrans1"></p>
            </div>

            <!-- Verse 2: Ta-Ha 20:114 -->
            <div class="morning-verse-item">
              <p class="arabic-line morning-arabic" id="morningArabic2" lang="ar" dir="rtl"></p>
              <p class="translation-line morning-trans" id="morningTrans2"></p>
            </div>

            <!-- Single Warm Light & Signature -->
            <div class="morning-footer">
              <div class="morning-warm-light" aria-hidden="true"></div>
              <p class="morning-sig">— Kamran</p>
            </div>
          </div>
        </div>

        <!-- Sleep Mode Deep Dark Overlay -->
        <div id="sleepOverlay" class="sleep-overlay" aria-hidden="true">
          <div class="sleep-sky-stars" id="sleepSkyStars" aria-hidden="true"></div>
          <div class="sleep-word" id="sleepWord">Rest.</div>
        </div>
      </div>
    </section>

  </main>

  <!-- Scripts: Standard script loading ensures 100% functionality on file:// double-click & web servers -->
  <script src="scripts/scenes/threshold.js"></script>
  <script src="scripts/scenes/road.js"></script>
  <script src="scripts/scenes/thread.js"></script>
  <script src="scripts/scenes/charge.js"></script>
  <script src="scripts/scenes/proud.js"></script>
  <script src="scripts/scenes/tonight.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
